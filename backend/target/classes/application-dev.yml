# Development Profile (dev)
# Seamless developer setup: uses MySQL if DB_URL is supplied, or in-memory MySQL-mode H2 for instant local development.
spring:
  datasource:
    url: ${DB_URL:jdbc:h2:mem:shopspheredb;MODE=MySQL;DATABASE_TO_LOWER=TRUE;DB_CLOSE_DELAY=-1}
    username: ${DB_USERNAME:sa}
    password: ${DB_PASSWORD:}
    driver-class-name: ${DB_DRIVER:org.h2.Driver}

  h2:
    console:
      enabled: true
      path: /h2-console

  jpa:
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        default_batch_fetch_size: 30

logging:
  level:
    root: INFO
    com.shopsphere: DEBUG
    org.springframework.security: INFO
